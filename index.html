<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090d18">
<title>Cheers!</title>
<style> 
  /* CHEERS — NEON COCKTAIL BAR MAKEOVER */

body {
  background:
    radial-gradient(circle at 15% 13%, #ff37a044, transparent 26%),
    radial-gradient(circle at 86% 18%, #007dff55, transparent 30%),
    radial-gradient(circle at 50% 80%, #8a3d2044, transparent 55%),
    linear-gradient(180deg, #14051f 0%, #050817 50%, #130b1a 100%);
  background-attachment: fixed;
}

header {
  position: relative;
  padding: 15px 5px 20px;
}

h1 {
  font-family: Georgia, serif;
  font-weight: 900;
  font-size: clamp(48px, 13vw, 76px);
  letter-spacing: -2px;
  color: #fff0b0;
  -webkit-text-stroke: 1px #ff9e2b;
  text-shadow:
    0 0 3px #fff,
    0 0 8px #ffb000,
    0 0 18px #ff7800,
    0 0 32px #ff29b8,
    0 0 55px #ff00bf;
  animation: neonSign 4s ease-in-out infinite;
}

header::after {
  content: "";
  display: block;
  width: 82%;
  height: 5px;
  margin: 9px auto 0;
  border-radius: 50%;
  background: linear-gradient(90deg,
    transparent, #ff30d6, #00dfff, #ff30d6, transparent);
  box-shadow:
    0 0 10px #ff20d6,
    0 0 24px #008cff;
}

.profile {
  margin-top: 15px;
}

.avatar {
  border: 3px solid #ffd16d;
  box-shadow:
    0 0 12px #ffcc55,
    0 0 26px #ff40bb77;
}

.gift {
  border: 2px solid #e9a94b;
  background:
    radial-gradient(circle at 50% 15%, #3c285b, transparent 75%),
    linear-gradient(155deg, #101529, #060b19);
  box-shadow:
    inset 0 1px 0 #fff5bc55,
    0 0 9px #ffa53d55,
    0 8px 22px #000a;
}

.gift:hover,
.gift:focus-visible {
  transform: translateY(-4px);
  border-width: 3px;
  border-color: #ffe38a;
  box-shadow:
    0 0 6px #fff6d0,
    0 0 15px #ffc342,
    0 0 28px #ff9b00,
    0 0 45px #ffb70088,
    inset 0 0 12px #ffd26944;
  animation: glitterGold 1.8s ease-in-out infinite;
}

.gift:active {
  transform: scale(.97);
}

.art {
  background:
    radial-gradient(circle at 50% 65%, var(--glow), transparent 70%),
    linear-gradient(160deg, #ffffff13, #020716);
}

.art svg {
  filter:
    drop-shadow(0 0 6px var(--glow))
    drop-shadow(0 5px 5px #000b);
}

.price {
  color: #ffe2a1;
  text-shadow: 0 0 8px #ffad4277;
}

.sheet {
  border: 2px solid #ffc76a;
  background: linear-gradient(160deg, #29113b, #090d20);
  box-shadow: 0 -10px 45px #ff3caf55;
}

@keyframes neonSign {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.22); }
}

@keyframes glitterGold {
  0%, 100% {
    box-shadow:
      0 0 8px #fff4b9,
      0 0 18px #ffb700,
      0 0 30px #ff9b0066;
  }
  50% {
    box-shadow:
      0 0 12px #ffffff,
      0 0 25px #ffd45c,
      0 0 42px #ffab00,
      0 0 55px #ff900099;
  }
}

@media (prefers-reduced-motion: reduce) {
  h1, .gift:hover, .gift:focus-visible {
    animation: none;
  }
}  <style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background: radial-gradient(ellipse at top,
    #29364c 0%, #151b2b 45%, #090d18 90%);
}
main {
  max-width: 500px;
  margin: auto;
  padding: 30px 16px 60px;
}
header { text-align: center; }
h1 {
  font-size: 52px;
  margin: 5px 0;
  letter-spacing: 2px;
  color: #ffcc85;
  text-shadow: 0 0 25px #e58b4a88;
}
.tagline {
  color: #d7c7bd;
  font-size: 14px;
}
.profile {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 28px 0;
  font-size: 15px;
}
.avatar {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  font-size: 24px;
  border-radius: 50%;
  background: #79527e;
  border: 2px solid #ffd095;
}
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 11px;
}
.gift {
  min-width: 0;
  min-height: 155px;
  padding: 11px 5px;
  border: 1px solid #ab8d9b;
  border-radius: 20px;
  background: linear-gradient(150deg, #453c63, #222c47);
  color: white;
  cursor: pointer;
  box-shadow: 0 8px 20px #0005,
    inset 0 1px 0 #ffffff33;
  transition: transform .15s, border-color .15s;
}
.gift:hover {
  transform: translateY(-3px);
  border-color: #ffd39a;
}
.gift:active { transform: scale(.96); }
.picture {
  height: 83px;
  margin-bottom: 10px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  background: radial-gradient(ellipse at top left,
    #a28bb777, #292842);
}
.picture span {
  font-size: 51px;
  filter: drop-shadow(0 6px 5px #0008);
}
.name {
  display: block;
  font-size: 13px;
  font-weight: bold;
}
.price {
  display: block;
  margin-top: 6px;
  color: #ffd18e;
  font-size: 14px;
  font-weight: bold;
}
footer {
  text-align: center;
  color: #a5a8ba;
  font-size: 11px;
  margin-top: 28px;
}
.overlay {
  position: fixed;
  inset: 0;
  background: #030610bd;
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 10;
}
.overlay.open { display: flex; }
.sheet {
  width: 100%;
  max-width: 500px;
  padding: 20px 24px 32px;
  border-radius: 28px 28px 0 0;
  border: 1px solid #997e91;
  background: linear-gradient(145deg, #28344c, #151b30);
  box-shadow: 0 -15px 50px #000a;
  animation: slideUp .25s ease-out;
}
.handle {
  width: 48px;
  height: 5px;
  margin: 0 auto 20px;
  border-radius: 8px;
  background: #85899a;
}
.sheet h2 { margin: 0 0 10px; }
.sheet p {
  color: #c7cbd8;
  font-size: 14px;
}
.summary {
  display: flex;
  justify-content: space-between;
  padding: 18px 0;
  border-bottom: 1px solid #ffffff33;
}
.summary strong { color: #ffd18e; }
.action {
  display: block;
  width: 100%;
  padding: 16px;
  margin-top: 17px;
  border: none;
  border-radius: 14px;
  background: #ffd18e;
  color: #1c2230;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
.secondary {
  background: transparent;
  border: 1px solid #65718a;
  color: white;
  margin-top: 10px;
}
.note {
  text-align: center;
  font-size: 12px !important;
}
.success {
  display: none;
  text-align: center;
  padding: 20px 0;
}
.success .glasses {
  font-size: 75px;
  animation: celebrate .6s ease-out;
}
.success h2 {
  font-size: 34px;
  color: #ffd18e;
  margin: 10px 0;
}
@keyframes slideUp {
  from { transform: translateY(45px); opacity: .4; }
  to { transform: translateY(0); opacity: 1; }
}
@keyframes celebrate {
  0% { transform: scale(.3) rotate(-25deg); }
  70% { transform: scale(1.2) rotate(10deg); }
  100% { transform: scale(1); }
}
@media (max-width: 370px) {
  main { padding-left: 10px; padding-right: 10px; }
  .grid { gap: 7px; }
  .gift { min-height: 140px; }
  .picture { height: 70px; }
  .picture span { font-size: 43px; }
}

<
/* Animated champagne celebration */

.clinking-glasses {
  position: relative;
  height: 125px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: visible;
}

.glass-left {
  display: inline-block;
  font-size: 78px;
  transform-origin: center bottom;
  animation: champagneClink 2.5s ease-in-out infinite;
  filter: drop-shadow(0 0 15px #ffce64);
}

.bubbles {
  position: absolute;
  top: 5px;
  left: 50%;
  font-size: 24px;
  white-space: nowrap;
  pointer-events: none;
  animation: champagneBubbles 2.5s ease-out infinite;
}

@keyframes champagneClink {
  0%, 100% {
    transform: scale(.85) rotate(-12deg);
  }
  35% {
    transform: scale(1.15) rotate(10deg);
  }
  48% {
    transform: scale(1.25) rotate(-5deg);
  }
  70% {
    transform: scale(1.05) rotate(0deg);
  }
}

@keyframes champagneBubbles {
  0%, 30% {
    opacity: 0;
    transform: translate(-50%, 25px) scale(.3);
  }
  45% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -90px) scale(1.5);
  }
}

.success h2 {
  text-shadow:
    0 0 8px #ffd76b,
    0 0 20px #ffac35,
    0 0 35px #ff37ba;
 animation: cheersGlow 2.5s ease-in-out infinite;
}

@keyframes cheersGlow {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.5); }
}
</style>
<body>
<main>
  <header>  <header>
    <h1>CHEERS!</h1>    <div class="tagline">A little gift. A big smile.</div>
  </header>

  <div class="profile">
    <div class="avatar">👩</div>
    <span>Send a little happiness to <b>Maly</b></span>
  </div>

  <div class="grid" id="gifts"></div>

  <footer>
    Cheers visual prototype · No real payments
  </footer>
</main>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="handle"></div>

    <div id="payment">
      <h2>Send a little happiness</h2>
      <p>Your gift for Maly</p>

      <div class="summary">
        <span id="selectedName"></span>
        <strong id="selectedPrice"></strong>
      </div>

      <button class="action" id="previewButton">
        Preview celebration
      </button>

      <button class="action secondary" id="cancelButton">
        Back to gifts
      </button>

      <p class="note">
        Demonstration only. No payment will be taken.
      </p>
    </div>

  <div class="success" id="success">
  <div class="clinking-glasses">
    <span class="glass-left">🥂</span>
    <span class="bubbles">✨ 🫧 ✨</span>
  </div>
  <h2>CHEERS!</h2>
  <p id="successMessage"></p>
  <button class="action" id="backButton">
    Back to gifts
  </button>
</div>  </div>
</div>

<script>
const gifts = [
  { name: "Coffee", price: 3.00, icon: "☕" },
  { name: "Beer", price: 4.99, icon: "🍺" },
  { name: "Cocktail", price: 5.99, icon: "🍸" },
  { name: "Wine", price: 6.99, icon: "🍷" },
  { name: "Shot", price: 4.99, icon: "🥃" },
  { name: "Champagne", price: 9.99, icon: "🍾" },
  { name: "Ring the Bell", price: 14.99, icon: "🔔" }
];

const grid = document.getElementById("gifts");
const overlay = document.getElementById("overlay");
const payment = document.getElementById("payment");
const success = document.getElementById("success");

let chosenGift = null;

gifts.forEach(gift => {
  const button = document.createElement("button");
  button.className = "gift";
  button.type = "button";

  button.innerHTML = `
    <div class="picture">
      <span>${gift.icon}</span>
    </div>
    <span class="name">${gift.name}</span>
    <span class="price">$${gift.price.toFixed(2)}</span>
  `;

  button.addEventListener("click", () => {
    chosenGift = gift;

    document.getElementById("selectedName").textContent =
      gift.name;

    document.getElementById("selectedPrice").textContent =
      "$" + gift.price.toFixed(2);

    payment.style.display = "block";
    success.style.display = "none";
    overlay.classList.add("open");
  });

  grid.appendChild(button);
});

function closeOverlay() {
  overlay.classList.remove("open");
}

document.getElementById("cancelButton")
  .addEventListener("click", closeOverlay);

document.getElementById("backButton")
  .addEventListener("click", closeOverlay);

document.getElementById("previewButton")
  .addEventListener("click", () => {
    if (!chosenGift) return;

    document.getElementById("successMessage").textContent =
      "A " + chosenGift.name.toLowerCase() +
      " for Maly. A little gift. A big smile.";

    payment.style.display = "none";
    success.style.display = "block";
  });

overlay.addEventListener("click", event => {
  if (event.target === overlay) closeOverlay();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeOverlay();
});
</script>

</body>
</html>
