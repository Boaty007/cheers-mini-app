<title>Cheers!</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: white;
  background:
    radial-gradient(ellipse at 15% 4%, #ef86ba55, transparent 45%),
    radial-gradient(ellipse at 92% 27%, #ab7de355, transparent 48%),
    linear-gradient(160deg, #422442, #694369 46%, #352143);
  background-attachment: fixed;
}

.wallpaper {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
  opacity: .33;
}

main {
  position: relative;
  z-index: 1;
  max-width: 500px;
  margin: auto;
  padding: 25px 15px 55px;
}

header {
  text-align: center;
  padding: 8px 0 16px;
}

.neon-marquee {
  display: grid;
  grid-template-columns: 66px minmax(0,1fr) 66px;
  align-items: center;
  justify-items: center;
  gap: 0;
  width: 100%;
  min-height: 112px;
}

h1 {
  font-family: "Pacifico", "Brush Script MT", cursive;
  font-size: clamp(38px,11.5vw,69px);
  font-weight: 400;
  line-height: 1.5;
  white-space: nowrap;
  margin: 0;
  color: #fff1fb;
  transform: rotate(-3deg);
  -webkit-text-stroke: .65px #ff8acb;
  animation: neonColours 6s ease-in-out infinite;
}

@keyframes neonColours {
  0%,100% {
    color: #fff1fb;
    text-shadow:
      0 0 3px white,
      0 0 9px #ff94d9,
      0 0 22px #ff2fa7,
      0 0 45px #d72bd6;
  }
  25% {
    color: #e7fcff;
    text-shadow:
      0 0 3px white,
      0 0 10px #80ecff,
      0 0 23px #00c9ff,
      0 0 45px #4b69ff;
  }
  50% {
    color: #fff4cd;
    text-shadow:
      0 0 3px white,
      0 0 10px #ffe0a0,
      0 0 23px #ffb72e,
      0 0 45px #ff6d6d;
  }
  75% {
    color: #fff1fb;
    text-shadow:
      0 0 3px white,
      0 0 10px #ff94d9,
      0 0 23px #ff2fa7,
      0 0 45px #d72bd6;
  }
}

.neon-symbol {
  width: 76px;
  height: 94px;
  overflow: visible;
  fill: none;
  stroke-width: 3.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  animation: symbolGlow 5s ease-in-out infinite;
}

.neon-heart {
  stroke: #ffd9f0;
  color: #ff67ba;
}

.neon-cocktail {
  stroke: #d9faff;
  color: #33dcff;
  animation-delay: -2s;
}

.neon-cocktail circle {
  fill: #ff82d4;
  stroke: #fff0f9;
  stroke-width: 1.5;
}

@keyframes symbolGlow {
  0%,100% {
    opacity: 1;
    filter:
      drop-shadow(0 0 4px currentColor)
      drop-shadow(0 0 12px currentColor);
  }
  50% {
    opacity: .85;
    filter:
      drop-shadow(0 0 8px currentColor)
      drop-shadow(0 0 20px currentColor);
  }
}

.tagline {
  color: #f0cce3;
  font-size: 14px;
  margin-top: 5px;
}

header::after {
  content: "";
  display: block;
  height: 4px;
  width: 82%;
  margin: 20px auto 0;
  border-radius: 20px;
  background: linear-gradient(
    90deg,
    transparent,
    #f23abb,
    #04dafa,
    #f23abb,
    transparent
  );
  box-shadow: 0 0 15px #f23abb;
}

.profile {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 24px 0;
  font-size: 14px;
  color: #eee1ec;
}

.avatar {
  width: 47px;
  height: 47px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 25px;
  background: #39204b;
  border: 2px solid #ffd27a;
  box-shadow: 0 0 16px #ffbc65aa;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 10px;
}

.grid > .gift:last-child:nth-child(3n + 1) {
  grid-column: 2;
}

.gift {
  position: relative;
  min-width: 0;
  min-height: 150px;
  padding: 9px 4px 12px;
  border: 2px solid #b67c4c;
  border-radius: 19px;
  background: linear-gradient(
    145deg,
    #633b68f2,
    #2d1b41f2 75%
  );
  color: white;
  cursor: pointer;
  box-shadow:
    inset 0 1px 0 #fff4c344,
    0 0 12px #a56d3d44;
  transition: transform .2s, border-color .2s;
}

.gift:hover,
.gift:focus-visible {
  outline: 0;
  transform: translateY(-3px);
  border-width: 3px;
  border-color: #ffe9a4;
  animation: giftGlow 1.8s ease-in-out infinite;
}

.gift:active {
  transform: scale(.97);
}

@keyframes giftGlow {
  0%,100% {
    box-shadow:
      0 0 8px #ffe8aa,
      0 0 22px #ffc145,
      0 0 36px #ff9a0044;
  }
  50% {
    box-shadow:
      0 0 14px #fff5c8,
      0 0 29px #ffbc4a,
      0 0 44px #ffa50088;
  }
}

.picture {
  height: 82px;
  display: grid;
  place-items: center;
  margin-bottom: 9px;
  border-radius: 13px;
  background: radial-gradient(
    ellipse at 50% 65%,
    #a24b8655,
    transparent 72%
  );
}

.picture span {
  font-size: 51px;
  filter: drop-shadow(0 0 9px #efb45277);
}

.name {
  display: block;
  font-size: 12px;
  font-weight: 800;
}

.price {
  display: block;
  margin-top: 5px;
  font-size: 14px;
  color: #ffd58e;
  font-weight: 800;
}

footer {
  text-align: center;
  color: #c9b4cb;
  font-size: 11px;
  margin-top: 25px;
}

/* Purple payment panel */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: #030512bc;
  display: none;
  align-items: flex-end;
  justify-content: center;
}

.overlay.open {
  display: flex;
}

.sheet {
  width: 100%;
  max-width: 500px;
  max-height: 94dvh;
  overflow-y: auto;
  padding:
    17px 23px
    calc(24px + env(safe-area-inset-bottom));
  border: 1px solid #d8a36e;
  border-bottom: 0;
  border-radius: 28px 28px 0 0;
  background: linear-gradient(
    155deg,
    #593458,
    #362342 68%,
    #241b34
  );
  box-shadow: 0 -14px 48px #000a;
  animation: sheetRise .28s ease-out;
}

@keyframes sheetRise {
  from {
    transform: translateY(40px);
    opacity: .5;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.handle {
  width: 48px;
  height: 5px;
  margin: 0 auto 18px;
  background: #8990a3;
  border-radius: 10px;
}

.sheet h2 {
  margin: 0 0 9px;
}

.sheet p {
  color: #e3d5e7;
  font-size: 14px;
  line-height: 1.5;
}

.summary {
  display: flex;
  justify-content: space-between;
  padding: 17px 0;
  border-bottom: 1px solid #ffffff30;
}

.summary strong {
  color: #ffd18e;
}

.action {
  display: block;
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 16px;
  margin-top: 16px;
  background: #ffd18e;
  color: #1b2333;
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
}

.action:disabled {
  opacity: .55;
  cursor: wait;
}

.secondary {
  background: transparent;
  color: white;
  border: 1px solid #a68aa8;
  margin-top: 10px;
}

.note {
  text-align: center;
  font-size: 12px !important;
}

#checkoutContainer {
  margin-top: 15px;
  min-height: 0;
  overflow: hidden;
  border-radius: 12px;
}

#checkoutStatus {
  color: #fbe1ee;
  font-size: 13px;
  line-height: 1.5;
  margin-top: 12px;
}

#checkoutError {
  color: #ffcfca;
  font-size: 13px;
  line-height: 1.5;
  margin-top: 12px;
}

/* Champagne celebration */

.success {
  display: none;
  text-align: center;
  padding: 0 0 6px;
}

.success h2 {
  font: 900 clamp(36px,10vw,51px) Georgia,serif;
  letter-spacing: 2px;
  margin: 0;
  color: #fff3b1;
  -webkit-text-stroke: .6px #ffc365;
  text-shadow:
    0 0 8px #ffb63c,
    0 0 22px #ff9b2e,
    0 0 35px #ec30b8;
}

.success p {
  margin: 14px 0 18px;
}

.celebration {
  position: relative;
  height: 207px;
  max-width: 340px;
  margin: 0 auto;
  isolation: isolate;
  overflow: hidden;
}

.celebration::before {
  content: "";
  position: absolute;
  inset: 36px 28px 3px;
  border-radius: 50%;
  background: radial-gradient(
    ellipse,
    #ffbf3855,
    transparent 66%
  );
  filter: blur(12px);
  opacity: .6;
}

.flute {
  position: absolute;
  top: 27px;
  width: 102px;
  height: 159px;
  overflow: visible;
  filter: drop-shadow(0 0 8px #ffc65a88);
}

.flute.left {
  left: calc(50% - 106px);
  transform-origin: 50% 92%;
}

.flute.right {
  right: calc(50% - 106px);
  transform-origin: 50% 92%;
}

.flute .glass {
  fill: #f9fbff16;
  stroke: #f7f3e6;
  stroke-width: 3.3;
  stroke-linejoin: round;
}

.flute .drink {
  fill: #f8b932c7;
}

.flute .shine {
  fill: none;
  stroke: #ffffffc9;
  stroke-width: 2.6;
  stroke-linecap: round;
}

.flute .stem {
  stroke: #f3eddf;
  stroke-width: 4;
  stroke-linecap: round;
}

.flute .tiny {
  fill: #fff4bf;
}

.impact {
  position: absolute;
  left: 50%;
  top: 47px;
  width: 16px;
  height: 16px;
  transform: translateX(-50%) scale(0);
  border-radius: 50%;
  background: #fff9d5;
  box-shadow:
    0 0 14px 6px #fff8b7,
    0 0 35px 14px #ffbc3d;
  opacity: 0;
  z-index: 4;
}

.impact::before,
.impact::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 72px;
  height: 3px;
  background: linear-gradient(
    90deg,
    transparent,
    #fff3b6,
    transparent
  );
  transform: translate(-50%,-50%);
}

.impact::after {
  transform: translate(-50%,-50%) rotate(90deg);
}

.particle {
  position: absolute;
  left: var(--x);
  top: var(--y);
  font-size: var(--s);
  color: var(--c);
  opacity: 0;
  pointer-events: none;
  z-index: 5;
  text-shadow: 0 0 9px currentColor;
}

.success.play .flute.left {
  animation: clinkLeft 3.6s ease-in-out both;
}

.success.play .flute.right {
  animation: clinkRight 3.6s ease-in-out both;
}

.success.play .impact {
  animation: clinkFlash 3.6s linear both;
}

.success.play .particle {
  animation: floatUp 3.6s ease-out both;
  animation-delay: var(--delay);
}

.success.play h2 {
  animation: signFlash 3.6s linear both;
}

@keyframes clinkLeft {
  0% {
    transform: translateX(-29px) rotate(-18deg);
  }
  23% {
    transform: translateX(-9px) rotate(-8deg);
  }
  32% {
    transform: translateX(25px) rotate(9deg);
  }
  38% {
    transform: translateX(18px) rotate(4deg);
  }
  46%,100% {
    transform: translateX(21px) rotate(6deg);
  }
}

@keyframes clinkRight {
  0% {
    transform: translateX(29px) rotate(18deg);
  }
  23% {
    transform: translateX(9px) rotate(8deg);
  }
  32% {
    transform: translateX(-25px) rotate(-9deg);
  }
  38% {
    transform: translateX(-18px) rotate(-4deg);
  }
  46%,100% {
    transform: translateX(-21px) rotate(-6deg);
  }
}

@keyframes clinkFlash {
  0%,30%,39%,100% {
    opacity: 0;
    transform: translateX(-50%) scale(0);
  }
  32% {
    opacity: 1;
    transform: translateX(-50%) scale(1.6);
  }
  35% {
    opacity: .8;
    transform: translateX(-50%) scale(2.6);
  }
}

@keyframes floatUp {
  0%,28% {
    opacity: 0;
    transform: translate(0,15px) scale(.35);
  }
  38% {
    opacity: 1;
    transform:
      translate(calc(var(--drift) * .2),-7px)
      scale(.85);
  }
  70% {
    opacity: .85;
    transform:
      translate(calc(var(--drift) * .7),-66px)
      scale(1.05);
  }
  100% {
    opacity: 0;
    transform:
      translate(var(--drift),-135px)
      scale(.7);
  }
}

@keyframes signFlash {
  0%,29% {
    filter: brightness(.85);
  }
  32% {
    filter:
      brightness(1.65)
      drop-shadow(0 0 10px #fff4a8);
  }
  36% {
    filter: brightness(1.2);
  }
  40% {
    filter:
      brightness(1.35)
      drop-shadow(0 0 8px #ff42d2);
  }
  47%,100% {
    filter: brightness(1.08);
  }
}

.neon-marquee.clink-active h1 {
  animation: headerClinkFlash 3.6s linear 1 both;
}

@keyframes headerClinkFlash {
  0%,29% {
    filter: brightness(1);
  }
  32% {
    filter: brightness(1.55);
    color: #fffefa;
    text-shadow:
      0 0 5px #fff,
      0 0 12px #fff,
      0 0 25px #fff1a0,
      0 0 42px #ffdd51;
  }
  36% {
    filter: brightness(1.15);
  }
  40% {
    filter: brightness(1.3);
  }
  48%,100% {
    filter: brightness(1);
  }
}

@media (max-width:370px) {
  .neon-marquee {
    grid-template-columns: 54px minmax(0,1fr) 54px;
    min-height: 95px;
  }
  .neon-marquee h1 {
    font-size: clamp(34px,10.5vw,46px);
  }
  .neon-symbol {
    width: 62px;
    height: 78px;
  }
  .grid {
    gap: 7px;
  }
  .gift {
    min-height: 137px;
  }
  .picture {
    height: 70px;
  }
  .picture span {
    font-size: 43px;
  }
}

@media (prefers-reduced-motion:reduce) {
  .neon-symbol,
  h1,
  .success.play .flute,
  .success.play .particle,
  .success.play .impact,
  .success.play h2,
  .neon-marquee.clink-active h1 {
    animation: none !important;
  }
  .flute.left {
    transform: translateX(21px) rotate(6deg);
  }
  .flute.right {
    transform: translateX(-21px) rotate(-6deg);
  }
  .particle {
    display: none;
  }
}
</style>
</head>

</div>

<script>
"use strict";

/*
  CHEERS STRIPE TEST CONFIGURATION

  This is a publishable Stripe TEST key.
  It is safe to use in browser code.

  Never place an sk_test or sk_live
  secret key in this HTML.
*/

const STRIPE_PUBLISHABLE_KEY =
  "pk_test_51URxGYBWoGBQK6CmRjUTgYV6ZFzMKYZIIi9abR9xO76gmSWkHYhjUKXV2bpWAGv84t8fUY69pgnhYEiI5gXpGoqq00RVbigoNe";

const CHECKOUT_URL =
  "https://boaty.app.n8n.cloud/webhook/cheers-payment";

/*
  The seven approved gifts.
*/

const gifts = [
  {
    id: "coffee",
    name: "Coffee",
    price: 3.00,
    icon: "☕"
  },
  {
    id: "beer",
    name: "Beer",
    price: 4.99,
    icon: "🍺"
  },
  {
    id: "cocktail",
    name: "Cocktail",
    price: 5.99,
    icon: "🍸"
  },
  {
    id: "wine",
    name: "Wine",
    price: 6.99,
    icon: "🍷"
  },
  {
    id: "shot",
    name: "Shot",
    price: 4.99,
    icon: "🥃"
  },
  {
    id: "champagne",
    name: "Champagne",
    price: 9.99,
    icon: "🍾"
  },
  {
    id: "bell",
    name: "Ring the Bell",
    price: 14.99,
    icon: "🔔"
  }
];

/*
  Page elements
*/

const marquee =
  document.querySelector(".neon-marquee");

const grid =
  document.getElementById("gifts");

const overlay =
  document.getElementById("overlay");

const payment =
  document.getElementById("payment");

const success =
  document.getElementById("success");

const payButton =
  document.getElementById("payButton");

const checkoutContainer =
  document.getElementById("checkoutContainer");

const checkoutStatus =
  document.getElementById("checkoutStatus");

const checkoutError =
  document.getElementById("checkoutError");

let chosenGift = null;
let embeddedCheckout = null;
let checkoutBusy = false;

/*
  Build all seven drink buttons.
  This runs independently of Stripe,
  so the gifts remain visible even
  if Stripe is unavailable.
*/

for (const gift of gifts) {

  const button =
    document.createElement("button");

  button.className = "gift";
  button.type = "button";

  const picture =
    document.createElement("div");

  picture.className = "picture";

  const icon =
    document.createElement("span");

  icon.setAttribute("aria-hidden", "true");
  icon.textContent = gift.icon;

  picture.appendChild(icon);

  const name =
    document.createElement("span");

  name.className = "name";
  name.textContent = gift.name;

  const price =
    document.createElement("span");

  price.className = "price";
  price.textContent =
    "$" + gift.price.toFixed(2);

  button.appendChild(picture);
  button.appendChild(name);
  button.appendChild(price);

  button.addEventListener("click", () => {
    openGift(gift);
  });

  grid.appendChild(button);
}

/*
  Stripe setup.

  Initialising Stripe only when needed
  prevents a Stripe loading problem
  from hiding the gift buttons.
*/

let stripe = null;

function getStripe() {

  if (stripe) {
    return stripe;
  }

  if (typeof window.Stripe !== "function") {
    throw new Error(
      "Stripe could not load. Check your internet connection."
    );
  }

  stripe = window.Stripe(
    STRIPE_PUBLISHABLE_KEY
  );

  return stripe;
}

/*
  Open a selected gift.
*/

function openGift(gift) {

  if (checkoutBusy) {
    return;
  }

  resetCheckout();

  chosenGift = gift;

  document.getElementById(
    "selectedName"
  ).textContent = gift.name;

  document.getElementById(
    "selectedPrice"
  ).textContent =
    "$" + gift.price.toFixed(2);

  payment.style.display = "block";
  success.style.display = "none";

  success.classList.remove("play");
  marquee.classList.remove("clink-active");

  overlay.classList.add("open");
  overlay.setAttribute("aria-hidden", "false");
}

/*
  Remove an old Stripe checkout.
*/

function resetCheckout() {

  if (embeddedCheckout) {
    try {
      embeddedCheckout.destroy();
    } catch (error) {
      console.warn(
        "Could not destroy previous checkout",
        error
      );
    }

    embeddedCheckout = null;
  }

  checkoutContainer.replaceChildren();

  checkoutStatus.textContent = "";
  checkoutError.textContent = "";

  payButton.style.display = "block";
  payButton.disabled = false;
  payButton.textContent =
    "Continue to secure payment";
}

/*
  Close the purple panel.
*/

function closeOverlay() {

  if (checkoutBusy) {
    return;
  }

  resetCheckout();

  overlay.classList.remove("open");
  overlay.setAttribute("aria-hidden", "true");

  success.classList.remove("play");
  marquee.classList.remove("clink-active");
}

document.getElementById(
  "cancelButton"
).addEventListener(
  "click",
  closeOverlay
);

document.getElementById(
  "backButton"
).addEventListener(
  "click",
  closeOverlay
);

overlay.addEventListener("click", event => {

  if (event.target === overlay) {
    closeOverlay();
  }

});

document.addEventListener("keydown", event => {

  if (event.key === "Escape") {
    closeOverlay();
  }

});

/*
  Connect to the n8n production webhook.

  n8n must return JSON containing:

  {
    "clientSecret": "cs_test_..._secret_..."
  }

  The amount must be calculated and
  validated in n8n, not trusted from
  the browser.

  This code does not grant a gift.
*/

payButton.addEventListener(
  "click",
  async () => {

    if (!chosenGift || checkoutBusy) {
      return;
    }

    checkoutBusy = true;

    payButton.disabled = true;
    payButton.textContent = "Opening payment...";

    checkoutError.textContent = "";
    checkoutStatus.textContent =
      "Connecting to Stripe test checkout...";

    try {

      const stripeInstance = getStripe();

      const response = await fetch(
        CHECKOUT_URL,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            gift: chosenGift.id
          })
        }
      );

      if (!response.ok) {
        throw new Error(
          "Payment server returned error " +
          response.status
        );
      }

      const data = await response.json();

      if (
        !data ||
        typeof data.clientSecret !== "string" ||
        !data.clientSecret
      ) {
        throw new Error(
          "The payment server did not return a valid checkout secret."
        );
      }

      embeddedCheckout =
        await stripeInstance.initEmbeddedCheckout({
          clientSecret: data.clientSecret,

          onComplete: () => {

            /*
              This callback does NOT
              deliver the gift.

              A separate verified Stripe
              webhook is required for
              payment confirmation.
            */

            // Stripe sandbox test celebration
if (STRIPE_PUBLISHABLE_KEY.startsWith("pk_test_")) {
  playCelebration(chosenGift);
} else {
  checkoutStatus.textContent =
    "Waiting for verified payment confirmation.";
}

payButton.style.display = "none";          }
        });

      checkoutStatus.textContent =
        "Secure Stripe test checkout";

      embeddedCheckout.mount(
        "#checkoutContainer"
      );

      payButton.style.display = "none";

    } catch (error) {

      console.error(
        "Cheers checkout error:",
        error
      );

      checkoutStatus.textContent = "";

      checkoutError.textContent =
        "Checkout could not open: " +
        error.message +
        " No payment was made by this attempt.";

      payButton.style.display = "block";
      payButton.textContent = "Try again";

    } finally {

      checkoutBusy = false;
      payButton.disabled = false;

    }

  }
);

/*
  Keep the approved champagne
  celebration animation available.

  It is deliberately NOT triggered
  merely by opening or completing
  the browser checkout.

  Only a verified server payment
  should trigger gift fulfilment.
*/

function playCelebration(gift) {

  if (!gift) {
    return;
  }

  document.getElementById(
    "successMessage"
  ).textContent =
    "A " +
    gift.name.toLowerCase() +
    " for Maly. A little gift. A big smile.";

  payment.style.display = "none";
  success.style.display = "block";

  success.classList.remove("play");

  void success.offsetWidth;

  success.classList.add("play");

  marquee.classList.remove("clink-active");

  void marquee.offsetWidth;

  marquee.classList.add("clink-active");
}

marquee.querySelector("h1")
  .addEventListener("animationend", event => {

    if (
      event.animationName ===
      "headerClinkFlash"
    ) {
      marquee.classList.remove(
        "clink-active"
      );
    }

  });

/*
  Celebration particles.
*/

const particles =
  document.getElementById("particles");

const symbols = [
  "♡","♥","✦","✧","○",
  "◦","✧","♡","○","✦",
  "◦","♥","✧","○","✦",
  "♡","◦","✧","○","♥"
];

for (let i = 0; i < symbols.length; i++) {

  const el =
    document.createElement("span");

  el.className = "particle";
  el.textContent = symbols[i];

  const x = 23 + (i * 37) % 54;
  const y = 36 + (i * 19) % 45;

  el.style.setProperty(
    "--x",
    x + "%"
  );

  el.style.setProperty(
    "--y",
    y + "%"
  );

  el.style.setProperty(
    "--s",
    (13 + (i % 4) * 4) + "px"
  );

  el.style.setProperty(
    "--c",
    i % 4 === 0
      ? "#ff83ca"
      : i % 3 === 0
        ? "#fff5c0"
        : "#ffd56c"
  );

  el.style.setProperty(
    "--drift",
    (
      (i % 2 ? 1 : -1) *
      (20 + (i * 17) % 58)
    ) + "px"
  );

  el.style.setProperty(
    "--delay",
    ((i % 5) * .08) + "s"
  );

  particles.appendChild(el);
}

// Cheers navigation buttons
document.getElementById("chatButton").addEventListener("click", function () {
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.close();
  } else {
    closeOverlay();
  }
});

document.getElementById("closeCheersButton").addEventListener("click", function () {
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.close();
  } else {
    closeOverlay();
  }
});
</script>
</body></html>
